name: Test Scripts

# Callers own their paths: filter (their scripts, data files and tests). The push/pull_request triggers are
# tooling's own CI: its tests run the inline logic of every workflow here.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tests/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-scripts-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-scripts:
    name: Shell tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Scripts run on the runner of their build target; each test file skips OSes its script never runs on.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # why: windows runners default to autocrlf, which breaks bash scripts with $'\r' errors.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # .tooling provides tests/lib.sh

      - name: Run tests/*.test.sh
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/*.test.sh)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::No tests/*.test.sh found; don't call test-scripts.yml from a repo without script tests"
            exit 1
          fi
          failed=0
          for t in "${tests[@]}"; do
            echo "::group::$t"
            bash "$t" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
