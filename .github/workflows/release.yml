name: Release

# Cuts a release of the CALLING repo from its main (github.* and vars resolve to the caller here):
#   1. rewrites every self-reference (<owner>/<repo>[/path]@main) to @v<version> in a release commit
#   2. tags that commit v<version> and publishes a GitHub release with generated notes
#   3. moves the floating tags (v<major>, and v0.<minor> during 0.x) to it, unless it's a pre-release
#      or an older version than the one the floating tag already has (so a hotfix never moves v1 backwards)
# main itself is never modified, so it keeps @main.
#
# Authenticates as a GitHub App (short-lived installation token, scoped to the caller's repo) because
# GITHUB_TOKEN can't push refs to commits that change .github/workflows/. Requires, org-level:
#   - variable RELEASE_APP_CLIENT_ID: the app's Client ID
#   - secret   RELEASE_APP_PRIVATE_KEY: the app's private key (.pem contents), passed by the caller
# The app needs repository permissions Contents: read & write, Workflows: read & write.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0, v0.1.0 or 0.1.0-rc.1)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0, v0.1.0 or 0.1.0-rc.1)"
        required: true
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate inputs
        id: validate
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be cut from main (got $GITHUB_REF)"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semver version (expected X.Y.Z or X.Y.Z-pre, optionally with a leading v)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Ensure tag does not exist
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi

      - name: Pin self-references to the release tag
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          self="${GITHUB_REPOSITORY//./\\.}(/[A-Za-z0-9_./-]+)?"
          mapfile -t files < <(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml' \
            'action.yml' 'action.yaml' '*/action.yml' '*/action.yaml')
          sed -i -E "s#(${self})@main\b#\1@v${VERSION}#g" "${files[@]}"

          if git grep -nE "${self}@main\b" -- "${files[@]}"; then
            echo "::error::Unrewritten @main self-references remain"
            exit 1
          fi
          git --no-pager diff --stat

      - name: Commit, tag and push
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --detach
          git commit -am "chore(release): v${VERSION}" --allow-empty
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PRERELEASE=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=(--prerelease)
          fi
          gh release create "v${VERSION}" --verify-tag --generate-notes --title "v${VERSION}" "${PRERELEASE[@]}"

      - name: Update floating tags
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "Skipping floating tag update for pre-release v${VERSION}"
            exit 0
          fi

          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"

          # highest stable release tag matching the pattern; the new tag is already created locally.
          highest() {
            git tag -l "$1" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1
          }
          float() {
            if [ "$(highest "$1.*")" != "v${VERSION}" ]; then
              echo "::notice::Not moving $1: a newer release than v${VERSION} exists ($(highest "$1.*"))"
              return
            fi
            git tag -fa "$1" -m "Update $1 to v${VERSION}"
            git push origin "$1" --force
          }

          float "v${MAJOR}"
          # float minor tag during 0.x, where minors may contain breaking changes
          if [ "$MAJOR" = "0" ]; then
            float "v0.${MINOR}"
          fi
