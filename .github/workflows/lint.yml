name: Lint Scripts

on:
  pull_request:
    paths:
      - "**.sh"
      - "**.bash"
      - "**.ps1"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "**.sh"
      - "**.bash"
      - "**.ps1"
      - ".github/workflows/lint.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # tests source .tooling/tests/lib.sh; shellcheck -x must resolve it

      - name: Run ShellCheck
        shell: bash
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        run: |
          git ls-files -z '*.sh' '*.bash' ':!:tests/fixtures/*' \
            | xargs -0 -r docker run --rm -v "$PWD:/repo" -w /repo --entrypoint shellcheck "$ACTIONLINT_IMAGE" -x

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $scripts = git ls-files "*.ps1" ":!:tests/*"
          if (-not $scripts) { exit 0 }

          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $issues = $scripts | Invoke-ScriptAnalyzer -Severity Error, Warning
          if ($issues) {
            $issues | Format-Table -AutoSize
            exit 1
          }
